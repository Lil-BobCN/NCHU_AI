[project]
name = "school-rag-api"
version = "0.1.0"
description = "School RAG intelligent Q&A API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3.0",
  "passlib>=1.7.4",
  "redis>=5.0.0",
  "minio>=7.2.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
  "python-dotenv>=1.0.0",
  "paddleocr>=3.0.0",
  "paddlepaddle==3.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
