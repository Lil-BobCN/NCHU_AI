services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_java_postgres
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - rag_java_postgres_data:/var/lib/postgresql/data
      - ../backend/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: rag_java_redis
    ports:
      - "127.0.0.1:6381:6379"

  minio:
    image: minio/minio:latest
    container_name: rag_java_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - rag_java_minio_data:/data

  backend:
    build:
      context: ../backend
    container_name: rag_java_backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "127.0.0.1:8020:8000"

  worker:
    build:
      context: ../backend
    container_name: rag_java_worker
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      BACKGROUND_WORKER_CONCURRENCY: 1
    depends_on:
      - postgres
      - redis
      - minio
    command: ["python", "-m", "app.workers.document_worker"]
    restart: unless-stopped

volumes:
  rag_java_postgres_data:
  rag_java_minio_data:
