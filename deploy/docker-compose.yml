services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
      - ../backend/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "127.0.0.1:6380:6379"

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - rag_minio_data:/data

  backend:
    build:
      context: ../backend
    container_name: rag_backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      WEB_CONCURRENCY: 4
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "127.0.0.1:8010:8000"

  worker:
    build:
      context: ../backend
    container_name: rag_worker
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      BACKGROUND_WORKER_CONCURRENCY: 1
    depends_on:
      - postgres
      - redis
      - minio
    command: ["python", "-m", "app.workers.document_worker"]
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: rag_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rag_postgres_data:
  rag_minio_data:
